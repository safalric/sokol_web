name: Kontrola dostupnosti

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: Produkcni health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Overeni konfigurace monitoru
        env:
          MONITOR_URL: ${{ secrets.MONITOR_URL }}
        run: |
          if [ -z "$MONITOR_URL" ]; then
            echo "MONITOR_URL zatim neni nastaven; produkcni monitoring je neaktivni."
            exit 0
          fi
          curl --fail-with-body --retry 2 --retry-delay 5 --max-time 15 "$MONITOR_URL/api/health" \
            | tee health.json
          node -e 'const fs=require("fs");const h=JSON.parse(fs.readFileSync("health.json","utf8"));if(h.ok!==true||h.status!=="ok")process.exit(1)'
