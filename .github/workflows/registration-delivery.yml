name: Dorucovani potvrzeni prihlasek

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: registration-delivery
  cancel-in-progress: false

jobs:
  delivery:
    if: vars.REGISTRATION_DELIVERY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Zpracovat frontu a overit chyby
        env:
          DELIVERY_ORIGIN: ${{ secrets.REGISTRATION_DELIVERY_ORIGIN }}
          JOBS_TOKEN: ${{ secrets.REGISTRATION_JOBS_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          try {
            const origin = new URL(process.env.DELIVERY_ORIGIN);
            if (origin.protocol !== "https:" || origin.username || origin.password || origin.pathname !== "/" || origin.search || origin.hash || !process.env.JOBS_TOKEN) throw new Error();
            const response = await fetch(new URL("/api/internal/registration-delivery", origin), {
              method: "POST",
              headers: { Authorization: `Bearer ${process.env.JOBS_TOKEN}` },
              redirect: "error",
              signal: AbortSignal.timeout(180000),
            });
            const result = await response.json();
            if (!response.ok || result.ok !== true) {
              console.error(`Udrzba vyzaduje kontrolu. HTTP ${response.status}; rucni kontrola: ${Number(result.counts?.manual || 0)}.`);
              process.exitCode = 1;
            } else {
              console.log(`Zpracovano: ${Number(result.processed)}; cekajici: ${Number(result.counts?.ready || 0)}.`);
            }
          } catch {
            console.error("Udrzbu nelze overit. Zkontrolujte konfiguraci, dostupnost webu a upozorneni spravce.");
            process.exitCode = 1;
          }
          JS
