name: Kontrola kvality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, testy a produkcni build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Stazeni repozitare
        uses: actions/checkout@v6

      - name: Instalace pnpm
        uses: pnpm/action-setup@v6

      - name: Nastaveni Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Instalace zavislosti
        run: pnpm install --frozen-lockfile

      - name: Validace verejneho obsahu
        run: pnpm content:check

      - name: Kontrola TypeScriptu
        run: pnpm check

      - name: Automaticke testy
        run: pnpm test

      - name: Integracni testy Worker API
        run: pnpm test:api

      - name: Produkcni build
        run: pnpm build

      - name: Instalace prohlizecu
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Cross-browser testy
        run: pnpm test:e2e

      - name: Audit vsech zavislosti
        run: pnpm audit --audit-level high

      - name: Ulozeni overeneho nahledu
        uses: actions/upload-artifact@v4
        with:
          name: sokol-web-${{ github.sha }}
          path: dist/
          retention-days: 7
