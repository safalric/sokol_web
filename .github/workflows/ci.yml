name: Kontrola kvality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, testy a produkcni build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Stazeni repozitare
        uses: actions/checkout@v4

      - name: Instalace pnpm
        uses: pnpm/action-setup@v4

      - name: Nastaveni Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalace zavislosti
        run: pnpm install --frozen-lockfile

      - name: Kontrola TypeScriptu
        run: pnpm check

      - name: Automaticke testy
        run: pnpm test

      - name: Integracni testy Worker API
        run: pnpm test:api

      - name: Produkcni build
        run: pnpm build

      - name: Audit produkcnich zavislosti
        run: pnpm audit --prod --audit-level high
